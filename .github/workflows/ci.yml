name: Continuous Integration

on:
  pull_request:
    branches:
      - master
  workflow_call:

jobs:
  rust-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust-components: rustfmt,clippy
          cache-key-prefix: rust-lint

      - name: Format
        run: cargo fmt -- --check

      # The crate only builds for Android targets, so clippy goes through cargo-ndk
      # Slint's build script compiles Java against android.jar: point it to the
      # compileSdk platform installed by the setup action (as Gradle does).
      - name: Linter
        run: ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar" cargo ndk -t arm64-v8a -P 34 clippy --locked -- -D warnings

  build-debug:
    runs-on: ubuntu-latest
    steps:
      # Full history: Gradle derives the versionCode from the commit count
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-key-prefix: rust-debug

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
