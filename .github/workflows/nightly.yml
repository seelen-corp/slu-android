name: Nightly

# Seelen UI Launcher Nightly: on every push to master, CI runs and the signed APK
# replaces the assets of the `nightly` pre-release (the tag is moved to the pushed
# commit). Distribution/updates happen through the store, not from here.

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  continuous-integration:
    uses: ./.github/workflows/ci.yml

  update-tag:
    needs: continuous-integration
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gen-version.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - run: git fetch --tags --prune

      - name: Create or update 'nightly' tag (force overwrite)
        run: |
          git tag -f nightly
          git push origin --force refs/tags/nightly

      - name: Generate Version
        id: gen-version
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            const cargoToml = fs.readFileSync('Cargo.toml', 'utf8');
            const pkg = cargoToml.split('[package]')[1].split(/\n\[/)[0];
            const version = pkg.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
            if (!version) {
              core.setFailed('version not found in Cargo.toml [package]');
              return '';
            }
            const timestamp = new Date().toISOString().replace(/[-:T]/g, '').slice(2, 12);
            return `${version}-nightly.${timestamp}`;

  build-apk:
    needs: update-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-key-prefix: rust-release

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SLU_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          SLU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SLU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SLU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          mv android/app/build/outputs/apk/release/app-release.apk \
            "dist/slu-launcher_${{ needs.update-tag.outputs.version }}.apk"
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload APK to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

  publish:
    needs:
      - update-tag
      - build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Create or update the nightly release, removing old assets
        uses: actions/github-script@v7
        env:
          VERSION: ${{ needs.update-tag.outputs.version }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const fields = {
              name: 'Seelen UI Launcher Nightly',
              body: `Nightly build \`${process.env.VERSION}\` from ${context.sha}.\n\nUnstable: built from the latest commit of \`master\`.`,
              prerelease: true,
              draft: false,
            };

            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag: 'nightly' }));
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (release) {
              await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, ...fields });
              const { data: assets } = await github.rest.repos.listReleaseAssets({ owner, repo, release_id: release.id });
              core.info(`Deleting ${assets.length} old assets`);
              await Promise.all(assets.map(asset =>
                github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id })));
            } else {
              await github.rest.repos.createRelease({ owner, repo, tag_name: 'nightly', ...fields });
            }

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist

      - name: Upload APK to the nightly release
        uses: svenstaro/upload-release-action@v2
        with:
          tag: nightly
          file: dist/*.apk
          file_glob: true
          overwrite: true
