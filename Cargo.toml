[package]
name = "slu_launcher"
version = "0.1.0"
edition = "2024"
description = "Seelen UI Launcher: Home Screen"

[lib]
name = "slu_launcher"
crate-type = ["cdylib"]

[dependencies]
slint = { version = "1.15.0", features = ["backend-android-activity-06"] }
android_logger = "0.14"
log = "0.4"
jni = "0.21"
rust-i18n = "4.2.1"

[build-dependencies]
slint-build = "1.15.0"

# Dependencies (Slint's bindings, layout, animations, input) optimized even in
# debug builds: unoptimized they can't keep up with a 120Hz screen.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
# Speed over size: "z" makes Slint's per-frame work (bindings, layout, item
# tree traversal) noticeably slower.
opt-level = 3
codegen-units = 1
lto = true
strip = true
panic = "abort"
