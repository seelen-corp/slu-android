name: Publish

# One pipeline for nightlies and releases. Each commit is built and its bundle
# uploaded to Google Play only once (Play accepts each versionCode once, but an
# uploaded bundle can be assigned to any track):
#
# - Push to master → nightly: the `nightly` GitHub pre-release is updated and
#   the bundle goes to the closed testing track.
# - Push of a vX.Y.Z tag → release: a GitHub release is created and the bundle
#   goes to the release track. If the nightly already uploaded that commit, the
#   existing bundle is assigned to the release track instead (it keeps the
#   nightly versionName X.Y.Z.N). Push the tag together with the commit
#   (`git push --atomic origin master vX.Y.Z`) to get a clean X.Y.Z: the master
#   run sees the tag and leaves Google Play to the tag run.

on:
  push:
    branches:
      - master
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    # Not evaluated for tag pushes
    paths-ignore:
      - "**.md"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: write

# Newer master pushes cancel older nightlies; each release tag runs on its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/master' }}

env:
  PLAY_PACKAGE_NAME: com.seelen.slu_launcher
  PLAY_RELEASE_TRACK: internal
  # Closed testing ("alpha" is the API name of the default closed track).
  # Switch to `beta` for open testing.
  PLAY_NIGHTLY_TRACK: alpha
  # Releases are rolled out right away (`draft` leaves them for manual review in
  # Play Console; it was required only before the app's first published release).
  PLAY_STATUS: completed

jobs:
  continuous-integration:
    uses: ./.github/workflows/ci.yml

  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      version-code: ${{ steps.plan.outputs.version-code }}
      track: ${{ steps.plan.outputs.track }}
      play: ${{ steps.plan.outputs.play }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --tags --force

      - name: Decide nightly or release
        id: plan
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const sh = (cmd) => execSync(cmd).toString().trim();

            const cargoToml = fs.readFileSync('Cargo.toml', 'utf8');
            const pkg = cargoToml.split('[package]')[1].split(/\n\[/)[0];
            const cargoVersion = pkg.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
            if (!cargoVersion) return core.setFailed('version not found in Cargo.toml [package]');

            // Same as the versionCode Gradle gives every build (build.gradle.kts)
            const commitNumber = sh('git rev-list --count HEAD');
            const releaseTag = `v${cargoVersion}`;

            let mode, play;
            if (context.ref.startsWith('refs/tags/')) {
              if (context.ref !== `refs/tags/${releaseTag}`) {
                return core.setFailed(`Tag ${context.ref} does not match Cargo.toml version ${releaseTag}`);
              }
              mode = 'release';
              play = true;
            } else {
              mode = 'nightly';
              // The commit is tagged for release: the tag run publishes it to Play.
              const tags = sh('git tag --points-at HEAD').split('\n');
              play = !tags.includes(releaseTag);
              if (!play) core.notice(`${releaseTag} points to this commit: Google Play is left to the release run`);
            }

            const outputs = {
              mode,
              version: mode === 'nightly' ? `${cargoVersion}.${commitNumber}` : cargoVersion,
              'version-code': commitNumber,
              track: mode === 'nightly' ? process.env.PLAY_NIGHTLY_TRACK : process.env.PLAY_RELEASE_TRACK,
              play: String(play),
            };
            for (const [key, value] of Object.entries(outputs)) {
              core.info(`${key}: ${value}`);
              core.setOutput(key, value);
            }

  build:
    needs: [continuous-integration, plan]
    runs-on: ubuntu-latest
    env:
      SLU_NIGHTLY: ${{ needs.plan.outputs.mode == 'nightly' }}
    steps:
      # Full history: Gradle derives the versionCode from the commit count
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-key-prefix: rust-release

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SLU_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # APK for GitHub (sideloading), AAB (bundle) for Google Play
      - name: Build release APK and AAB
        working-directory: android
        env:
          SLU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SLU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SLU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Rename APK and AAB
        run: |
          mkdir -p dist
          mv android/app/build/outputs/apk/release/app-release.apk \
            "dist/slu-launcher_${{ needs.plan.outputs.version }}.apk"
          mv android/app/build/outputs/bundle/release/app-release.aab \
            "dist/slu-launcher_${{ needs.plan.outputs.version }}.aab"
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload APK and AAB to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  github-release:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.plan.outputs.mode == 'nightly'

      - name: Move the 'nightly' tag to this commit
        if: needs.plan.outputs.mode == 'nightly'
        run: |
          git tag -f nightly
          git push origin --force refs/tags/nightly

      - name: Download APK and AAB
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Nightly: the `nightly` pre-release gets the APK and AAB.
      # Release: a vX.Y.Z release gets the APK (the AAB is for Play only).
      # Re-runs replace the assets of the existing release.
      - name: Create or update the GitHub release
        uses: actions/github-script@v7
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          VERSION: ${{ needs.plan.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const nightly = process.env.MODE === 'nightly';
            const version = process.env.VERSION;
            const tag = nightly ? 'nightly' : `v${version}`;

            const fields = nightly
              ? {
                  name: 'Seelen UI Launcher Nightly',
                  body: `Nightly build \`${version}\` from ${context.sha}.\n\nUnstable: built from the latest commit of \`master\`.`,
                  prerelease: true,
                }
              : { name: `Seelen UI Launcher v${version}`, prerelease: false };

            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag }));
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (release) {
              await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, ...fields });
              const { data: assets } = await github.rest.repos.listReleaseAssets({ owner, repo, release_id: release.id });
              core.info(`Deleting ${assets.length} old assets`);
              await Promise.all(assets.map((asset) =>
                github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id })));
            } else {
              // Draft until its assets are uploaded
              ({ data: release } = await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha,
                generate_release_notes: !nightly, draft: true, ...fields,
              }));
            }

            const files = fs.readdirSync('dist').filter((f) => nightly || f.endsWith('.apk'));
            for (const name of files) {
              const data = fs.readFileSync(path.join('dist', name));
              core.info(`Uploading ${name}`);
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name, data,
                headers: { 'content-type': 'application/octet-stream', 'content-length': data.length },
              });
            }

            await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, draft: false });

  # Requires the GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret (a service account
  # with release permissions on the app in Play Console). The very first
  # bundle of an app must be uploaded by hand in Play Console; the API only
  # works after that.
  google-play:
    needs: [plan, build]
    if: needs.plan.outputs.play == 'true'
    runs-on: ubuntu-latest
    # Play edits of different runs must not overlap
    concurrency:
      group: google-play
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to Google Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_AAB: dist/slu-launcher_${{ needs.plan.outputs.version }}.aab
          PLAY_VERSION_CODE: ${{ needs.plan.outputs.version-code }}
          PLAY_TRACK: ${{ needs.plan.outputs.track }}
          PLAY_RELEASE_NAME: ${{ needs.plan.outputs.mode == 'release' && format('v{0}', needs.plan.outputs.version) || needs.plan.outputs.version }}
        run: node scripts/play-publish.mjs
